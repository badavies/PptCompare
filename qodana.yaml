version: "1.0"

ide: QDNET

# JetBrains' broader, generally useful inspection profile.
profile:
  name: qodana.recommended

exclude:
  # Generated and packaged output.
  - name: All
    paths:
      - PptCompare/bin
      - PptCompare/obj
      - PptCompare/publish
      - PptCompare/dist
      - PptCompare.Tests/bin
      - PptCompare.Tests/obj

  # Allocation observations are useful during dedicated performance
  # profiling, but overwhelm normal quality reports.
  - name: HeapView.ObjectAllocation
  - name: HeapView.ObjectAllocation.Evident
  - name: HeapView.ObjectAllocation.Possible
  - name: HeapView.DelegateAllocation
  - name: HeapView.ClosureAllocation
  - name: HeapView.BoxingAllocation

  # These DataContexts are assigned at runtime. Qodana cannot resolve
  # their bindings statically, although WPF resolves them correctly.
  - name: Xaml.BindingWithoutContextNotResolved
    paths:
      - PptCompare/MainWindow.xaml
      - PptCompare/SettingsWindow.xaml

  # Public properties are required for WPF data binding.
  - name: MemberCanBePrivate.Global
    paths:
      - PptCompare/ViewModels
      - PptCompare.Tests/HardeningTests.cs

  - name: UnusedMember.Global
    paths:
      - PptCompare/ViewModels
      - PptCompare.Tests/HardeningTests.cs

  # These test members emulate PowerPoint's dynamic COM API.
  - name: UnusedParameter.Global
    paths:
      - PptCompare.Tests/HardeningTests.cs

  - name: AutoPropertyCanBeMadeGetOnly.Global
    paths:
      - PptCompare.Tests/HardeningTests.cs

  # ICommand.Execute must return void; the implementation catches
  # and safely handles asynchronous exceptions.
  - name: AsyncVoidMethod
    paths:
      - PptCompare/Infrastructure/RelayCommand.cs

  # Debug.WriteLine is intentionally omitted from Release builds.
  - name: InvocationIsSkipped

  # Conventional WPF partial-class declarations.
  - name: RedundantExtendsListEntry
    paths:
      - PptCompare/App.xaml.cs
      - PptCompare/MainWindow.xaml.cs
      - PptCompare/SettingsWindow.xaml.cs
      - PptCompare/AboutWindow.xaml.cs

  # Interface exists for dependency injection and testing.
  - name: UnusedMemberInSuper.Global
    paths:
      - PptCompare/Services/ApplicationSettingsServices.cs

  # Assertion-syntax preferences rather than test defects.
  - name: MSTEST0037
  - name: MSTEST0046
  - name: MSTEST0068

# Reject actual errors and warnings, while allowing informational notes.
# Remove this section if using Qodana Community for .NET, which does not
# support severity-specific thresholds.
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
